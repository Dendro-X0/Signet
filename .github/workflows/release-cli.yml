# Build and attach Signet CLI binaries + installers to a GitHub Release on tag v*.
name: release-cli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: signet-x86_64-pc-windows-msvc.exe
            bin: signet.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: signet-x86_64-unknown-linux-gnu
            bin: signet
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: signet-aarch64-unknown-linux-gnu
            bin: signet
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: signet-aarch64-apple-darwin
            bin: signet
          # Cross-compile Intel macOS from Apple Silicon runners (macos-13 queue is unreliable)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: signet-x86_64-apple-darwin
            bin: signet

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p signet --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          cp "$SRC" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect + checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cp installers/install.sh dist/install.sh
          cp installers/install.ps1 dist/install.ps1
          cd dist
          sha256sum signet-* install.sh install.ps1 > SHA256SUMS
          ls -la
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/signet-*
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
          body: |
            ## Signet ${{ github.ref_name }}

            ### Install

            **Windows (PowerShell)**
            ```powershell
            irm https://github.com/Dendro-X0/Signet/releases/latest/download/install.ps1 | iex
            ```

            **macOS / Linux**
            ```bash
            curl -LsSf https://github.com/Dendro-X0/Signet/releases/latest/download/install.sh | sh
            ```

            Then: `signet self update` or TUI → **Update Signet** / **Uninstall Signet**.

            See [CHANGELOG.md](https://github.com/Dendro-X0/Signet/blob/main/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
