# Build and attach Signet CLI binaries + installers to a GitHub Release on tag v*.
name: release-cli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: signet-x86_64-pc-windows-msvc.exe
            bin: signet.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: signet-x86_64-unknown-linux-gnu
            bin: signet
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: signet-aarch64-apple-darwin
            bin: signet
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: signet-x86_64-apple-darwin
            bin: signet

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p signet --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          cp "$SRC" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect + checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cp installers/install.sh dist/install.sh
          cp installers/install.ps1 dist/install.ps1
          cd dist
          sha256sum signet-* install.sh install.ps1 > SHA256SUMS
          ls -la
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
