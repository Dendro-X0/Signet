name: Deploy HOOK

# Publishes docs/launch/preview → GitHub Pages (Release Trust Desk landing)

on:
  push:
    branches: [main]
    paths:
      - "docs/launch/preview/**"
      - ".github/workflows/deploy-hook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-hook
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/launch/preview
      - id: deployment
        uses: actions/deploy-pages@v4
