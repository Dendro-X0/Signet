[workspace]
resolver = "2"
members = ["crates/signet"]
default-members = ["crates/signet"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dendro-X0/Signet"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
hex = "0.4"
minisign = "0.7"
ratatui = "0.29"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
which = "7"
x509-parser = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
